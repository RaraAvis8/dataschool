name: sqlbox

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: herokuchinook
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5433:5432"   # exposed for debugging/inspection; API uses the internal net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d herokuchinook"]
      interval: 3s
      timeout: 3s
      retries: 30

  api:
    build: ./api
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: herokuchinook
      PGUSER: readonly
      PGPASSWORD: readonly
      SITE_ORIGIN: http://localhost:4000
    ports:
      - "8084:8084"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
